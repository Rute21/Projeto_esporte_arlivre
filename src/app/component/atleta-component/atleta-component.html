<section id="form">
    <h2>Cadastro de Atleta</h2>

    <form id="form-atleta" (submit)="enviarDadosAtleta()">
        <label for="nome">Nome Completo:</label>
        <input type="text" name="nome" id="nome" [(ngModel)] = "nome" class="input01" maxlength="60"
         required placeholder="Digite o nome completo">

        <label for="cpf">CPF:</label>
        <input type="text" name="cpf" id="cpf" [(ngModel)] = "cpf" class="input02" maxlength="14"
        required placeholder="Digite o cpf">

        <label for="sexo">Sexo:</label>
        <input type="radio" name="sexo" id="sexo" [(ngModel)] = "sexo" class="radio01" 
        required value="M"> <span>Masculino</span>

       <input type="radio" name="sexo" id="sexo" [(ngModel)] = "sexo" class="radio01" 
       required value="F"><span>Feminino</span>

       <input type="radio" name="sexo" id="sexo" [(ngModel)] = "sexo" class="radio01" 
       required value="N"><span> Não Declarar</span>

       <label for="uf">UF:</label>
       <input type="text" name="uf" id="uf" [(ngModel)] = "uf" class="input02" maxlength="60"
      required placeholder="Digite a uf">
       
       <label for="cep">CEP:</label>
       <input type="text" name="cep" id="cep" [(ngModel)] = "cep" class="input02" maxlength="9"
       required placeholder="Digite o cep">

       <label for="ruaLogradouro">Rua/Logradouro:</label>
       <input type="text" name="ruaLogradouro" id="ruaLogradouro" [(ngModel)] = "ruaLogradouro" class="input01" maxlength="100"
        required placeholder="Digite a Rua ou Lagradouro">

      <label for="bairro">Bairro:</label>
      <input type="text" name="bairro" id="bairro" [(ngModel)] = "bairro" class="input02" maxlength="60"
      required placeholder="Digite o bairro"> 

      <label for="cidade">Cidade:</label>
      <input type="text" name="cidade" id="cidade" [(ngModel)] = "cidade" class="input02" maxlength="60"
      required placeholder="Digite a cidade">

      <div id="div-btns">
        <button type="submit" id="btnAdd">Cadastrar</button>
        <button type="reset" id="btnLimpar">Limpar</button>
      </div>

      
    </form>
</section>
