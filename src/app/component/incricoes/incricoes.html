<div class="inscricao">

    <h1>INSCRIÇÃO NA CORRIDA</h1>
    
    <div class="linha">

        <div class="campo atleta">
            <label>Atleta Cadastrado:</label>

            <select>
                <option>Selecione o atleta</option>
                <option>João da Silva</option>
                <option>Maria Santos</option>
            </select>
        </div>

        <div class="campo cpf">
            <label>Buscar por CPF:</label>

            <input
                type="text"
                placeholder="000.000.000-00">
        </div>

    </div>


    <div class="linha">

        <div class="campo corrida">
            <label>Corrida Escolhida:</label>

            <select>
                <option>Selecione a corrida</option>
                <option>Circuito das Estações - Etapa Verão</option>
            </select>
        </div>


        <div class="campo distancia">

            <label>Distância da Prova:</label>

            <div class="opcoes">

                <label>
                    <input type="radio" name="distancia" value="5">
                    5km
                </label>

                <label>
                    <input type="radio" name="distancia" value="10">
                    10km
                </label>

                <label>
                    <input type="radio" name="distancia" value="25">
                    25km
                </label>

            </div>

        </div>

    </div>


    <div class="linha">

        <div class="campo camiseta">

            <label>Tamanho da Camiseta (Kit):</label>

            <select>
                <option>Selecione</option>
                <option>PP</option>
                <option>P</option>
                <option>M</option>
                <option>G</option>
                <option>GG</option>
            </select>

        </div>


        <div class="campo categoria">

            <label>Categoria / Faixa Etária:</label>

            <input
                type="text" name ="categoria" id="categoria">

        </div>

    </div>


    <div class="valor-inscricao">

        <strong>Valor da Inscrição:</strong>

        <span>R$ 89,90</span>

    </div>


    <div class="termos">

        <input
            type="checkbox"
            id="termos">

        <label for="termos">
            Li e aceito os termos do regulamento da prova e declaração de saúde.
        </label>

    </div>


    <button class="btn-finalizar">
        Finalizar e Ir para Pagamento
    </button>

</div>
